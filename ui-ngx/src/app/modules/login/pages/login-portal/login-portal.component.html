<div class="tb-login-content mat-app-background tb-dark flex  justify-center items-center m-0" style="margin: 0px;" >
  <mat-card appearance="raised" style="height: 100vh;width: 100vw; overflow: hidden; " class="rounded-none">
    <mat-card-content>
      <div class="flex  justify-center items-center">
        <div class=" flex flex-col  items-center justify-center" style="height: 100vh;width: 100vw;" >
          <div class=" flex flex-col  content-center"  style="padding: 15px 0;">
            <tb-logo class="login-logo"></tb-logo>
          </div>
          <div class=" flex flex-col content-center justify-stretch" style="padding: 15px 0;">
            <p *ngIf="state === 'connecting'">Verbindet mit Datenplattform...</p>
            <p *ngIf="state === 'connected'">Verbunden mit Datenplattform...</p>
            <p *ngIf="state === 'waitingForToken'">Warte auf Login...</p>
            <p *ngIf="state === 'loggingIn'">Login läuft...</p>
          </div>
          <mat-progress-bar color="warn" mode="indeterminate" class="w-full">
          </mat-progress-bar>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
